name: Apply final template

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-final-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract final zip and overwrite project files
        run: |
          unzip -o releases/MediaPipe-Gesture--VibeCoding_index_finger_write_smooth_original_bg.zip -d /tmp/final-version
          cp /tmp/final-version/MediaPipe-Gesture--VibeCoding-main/templates/index_v4.html templates/index_v4.html
          cp /tmp/final-version/MediaPipe-Gesture--VibeCoding-main/app.py app.py

      - name: Commit final template if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py templates/index_v4.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Apply final finger-write smooth template"
            git push
          fi
